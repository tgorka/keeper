<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The mark, cut by `bun run scripts/gen-mark-icons.ts` into the repo root so
         one file serves the browser tab, the file browser and GitHub. The path is
         RELATIVE: Vite has no publicDir here, so `/favicon.png` would be passed
         through untouched and 404 in dev and in the bundle alike. A relative href
         is resolved as a build asset and emitted into dist. This replaced a link
         to `/vite.svg`, a scaffold leftover that has never existed in this repo.
         The ORDER is load-bearing, not cosmetic. Chromium prefers a raster over
         a vector whenever the raster's link declares no size
         (crbug.com/1162276), so every raster link here carries an explicit
         `sizes`: `any` on the ICO, which says "pick from the sizes inside me"
         rather than letting an engine treat it as one unknown-size image, and
         `1024x1024` on the PNG, its measured IHDR. With both rasters sized, the
         SVG listed LAST wins wherever it is understood — where two links match,
         a browser prefers the later one it understands — and the rasters are
         what remains for engines that ignore the vector. `favicon.ico` carries
         16/24/32/48/64/256 for the tab, the taskbar and a large-icon file
         listing; the 1024px PNG stays as the single big raster GitHub and file
         browsers read. -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./favicon.png" sizes="1024x1024" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*) for edge-to-edge phone
         rendering (Story 13.5, FR-59); interactive-widget=resizes-content resizes
         the layout viewport under the on-screen keyboard on Chromium webviews
         (WKWebView ignores it and uses the visualViewport-driven --kb-inset). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>keeper</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
