  #
  # THE OWNER COULD NOT SEE ANY OF IT. 2026-08-28: reported "virtual files
  # developed but I don't see it in the keeper app UI (settings, drive
  # settings, files)". He was right, and it was not a UI gap:
  #   VirtualPolicy had exactly ONE production consumer, Engine::verify. The
  #   arrival path (materialize_pending) still branched only on
  #   profile.lfs_mode == PointerOnly, so virtualPatterns could not keep a
  #   single file virtual. Nothing ever became virtual, so the row states, the
  #   countdown and the verbs had nothing to render. FR-328 says "which paths
  #   are allowed to stay unmaterialized AFTER A PULL" and no story's
  #   acceptance criteria owned that path. The epic's fault, not the stories'.
  # Two more reasons it was invisible: there was no control anywhere for
  # virtualPatterns / virtualOverBytes / releaseTtlMs (and all three were
  # PRESERVED, so no form could have saved them), and
  # SyncPlatform::open_file_state answered Unknown on every host, so AD-125
  # turned every release into a refusal.
  #
  # FIVE FOLLOW-UP STORIES, a second gh-stack on main, bottom to top:
  #   #284 56.10 feat/56-10-the-policy-decides-what-arrives
  #   #285 56.11 feat/56-11-is-this-file-open-answered-for-real
