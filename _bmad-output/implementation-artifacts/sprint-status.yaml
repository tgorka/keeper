  # -- EPIC 57, 2026-08-22: scheduled tasks ----------------------------------
  #
  # Split out of epic 56's fourth ask ("cron job like ... widok w ui do
  # taskow"). AD-135..AD-137 in
  # architecture/architecture-keeper-2026-07-03/ARCHITECTURE-SCHEDULED-TASKS.md.
  #
  # The constraint this epic is shaped by is AD-62, not the anti-timer prose:
  # ONE CLOCK PER HOST PROCESS, because "two schedulers over one git
  # repository is how you get concurrent index locks". A due task is a
  # due-gate on a tick that already exists - the engine's TICK_MS supervisor
  # tick, or the app's own 1 Hz interval at keeper/src/lib.rs:509-541 which
  # already hosts notes_vault::cadence_tick(). No new interval, anywhere.
  #
  # What is genuinely absent is a RECORD: the journal DELETEs rows on success
  # (db.rs:826-832) and activity is "a human-facing log, not a source of
  # truth" (db.rs:99-101), so neither can back a tasks view. 57.1 creates
  # tasks + task_runs.
  #
  # The impure-shell risk here is NOT the schedule maths - keep decide() pure
  # over an injected clock, and never prove a schedule by sleeping. It is TWO
  # PROCESSES ON ONE sync.db (the daemon and the app both write it -
  # ipc.rs:4926-4930): 57.2's lease must be raced with two real connections,
  # the way db::claim_ready is proven. Second risk is SILENCE: an enabled,
  # unhosted, quiet task looks identical to a working one, so 57.6 asserts the
  # unhosted state.
  #
  # Platform truth (AD-137): macOS has NO daemon - keeper-syncd is
  # "Linux-first, unix-only" (keeper-syncd/src/platform.rs:11-19) and no
  # launchd plist exists - so on macOS the desktop app is the only host and a
  # task runs only while keeper runs. Linux has the user service and gets a
  # .timer that calls the same one-shot verb.
  #
  # `update` may NOT be a task kind: docs/sync.md:889-893 refuses unattended
  # binary replacement, and that refusal stands.
  #
  # 57.4 is the story that closes the owner's ask and can ship before any UI.
  #
  # IMPLEMENTED 2026-08-30 as four PRs on the epic-56 stack, bottom to top:
  #   #292  57.1 + 57.2  feat/57-1-a-task-is-something-keeper-remembers
  #   #293  57.3 + 57.4  feat/57-3-the-verb-a-cron-can-call
  #   #295  57.5 + 57.6 + 57.7 (and the review loopback all three nearly
  #         shipped without: their step-04 fan-out was cut by a budget and the
  #         spec recorded the pass as NOT RUN. Run afterwards: 17 findings, 14
  #         after dedup, 1 high — the quit path freed a task lease while that
  #         task's run was still executing.)
  # Three claims the epic asserted turned out false against the code and are
  # corrected in those PRs: `tasks run` performs its work unconditionally so
  # `OnCalendar` IS the cadence (the first timer draft would have run a nightly
  # sweep 24 times a day); `keeper-syncd` DOES build and ship for Darwin, the
  # provable fact being that no launchd plist exists anywhere in the tree; and
  # `enable-linger` was named in the architecture and present in no line of code.
  # SYNCED 2026-08-31: #295 merged, so all seven shipped in v0.8.24. 57.2, 57.4
  # and 57.6 have no spec of their own — they shipped inside 57.1, 57.3 and 57.5's
  # specs, which is why only four spec files exist for seven stories.
