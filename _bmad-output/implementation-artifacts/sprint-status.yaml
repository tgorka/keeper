  # session-spaces.tsx across 60-odd interleaved hunks, so a hunk split would
  # have produced two branches that each fail to compile alone.
  #
  #   #161  52.1  the record is called README        -> main
  #   #162  52.2  a rename the open pane follows     -> #161
  #   #163  52.3  note mode is a place you can write -> #162
  #   #164  52.9  fractions, and an icon at the root -> #163
  #   #165  52.4 + 52.5  spaces first, untagged, and where creates land -> #164
  #   #166  52.6  a form you can reach both ends of  -> #165
  #   #167  52.7  a card you can actually drop       -> #166
  #   #168  52.8  a file row you can right-click     -> #167
  #   #169  fix   what epic 52's review pass found   -> #168
  #
  # TWO REVIEWERS, BOTH `incorrect`, TWO P1s that would have reached the drive:
  #   * 52.1 registered and wrapped `sessions_record_migrate` and invoked it
  #     from nowhere, while narrowing shape() and repointing row_for at
  #     README.md - so every flat session already on the drive would have
  #     parsed an EMPTY record on the next rescan (id -> `path:`, title, pin
  #     and lineage gone) with the only remedy unreachable.
  #   * 52.2 replaced onWritten with onRenamed unconditionally, so a retitle
  #     that does not MOVE the file - the record itself, or any title whose
  #     slug is unchanged - reloaded nothing and the next Save silently wrote
  #     the old title back. Invisible because every fixture was a README while
  #     every mock returned a moved path, which the real command cannot answer
  #     for those files.
  #
  # THE MACOS GATE EARNED ITS KEEP AGAIN. The shell crate does not compile on
  # Linux, so `bun run check:rust:macos` was the FIRST compile of four call
  # sites: 4 x E0433 (`model` unresolved in scopes that never imported it) and
  # then 3 shell-crate test failures whose fixtures built a flat session the
  # old way - about.md with no AGENTS.md, which after the narrowing reads as
  # folder-shaped. All of it landed in 52.1, where the code lives, not at the
  # tip.
  #
  # OWED, and honest about it:
  #   * the 900x900 browser measurement for 52.6 (no Chromium in the container;
  #     jsdom shims every rect to 1024x768, so the panel top and the icon
  #     grid's height after shrink-0 are unmeasured here)
  #   * the WebKit drag click-through for 52.7 (jsdom implements no
