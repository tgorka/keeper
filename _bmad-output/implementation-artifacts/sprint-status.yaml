  # claims against the code before the spine was written. Five of the eight were
  # `unreachable` rather than absent — the capability was built and nothing
  # rendered it — and ONE was already true: a session space has always held N
  # notes (`Vec` in the domain, `Vec` on the wire, `files.map` in the UI, a
  # two-file listing asserted since it shipped). What the owner felt as a cap was
  # the WRITE path: no space could create into itself, so About/References/Tasks
  # held exactly what the template wrote, forever. Nothing was built for
