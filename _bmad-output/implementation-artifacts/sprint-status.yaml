  # of the mic track, so Apple's voice-processing unit does cancel another
  # process's playback — the premise held. The owner then recorded five sessions
  # of their own on 2026-08-05 and decided the switch ships OFF: the cancellation
  # is real but it costs a mono track and non-defeatable voice-band noise
  # suppression, and headphones remove the reverb without any processing. Opt-in,
  # documented, with the numbers in the spec.
