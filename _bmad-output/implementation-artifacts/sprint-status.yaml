  # -- EPIC 56, 2026-08-22: virtual files ------------------------------------
  #
  # Planned from research, not from a report: four web research passes and three
  # read-only repository scouts ran before the spine was written
  # (planning-artifacts/research-virtual-files-2026-08-22.md, run folder
  # research/virtual-files-2026-08-22/). AD-122..AD-134 in
  # architecture/architecture-keeper-2026-07-03/ARCHITECTURE-VIRTUAL-FILES.md.
  #
  # The load-bearing separation, and the reason the epic is shaped this way:
  # git-lfs shipped "a gitignore-style list of paths not to download" and "the
  # rule that authorizes deleting them" as ONE mechanism, and lost data for it
  # (git-lfs#3092). AD-123 splits them permanently: the pattern file authorizes
  # HYDRATION decisions; only per-object proof authorizes DELETION.
  #
  # 56.4 and 56.5 are the data-loss stories. Both must assert against a real
  # git fixture, a real rename(2), a real index stat and a real process holding
  # the file open - story 34.11's model, not a pure function over a TestPlatform.
  # The two failures the suite cannot otherwise see: a released path that reads
  # MODIFIED forever (DW-140's shape), and a released path whose bytes existed
  # nowhere else.
  #
  # Ask 5 (Finder / ls integration) is CLOSED, not deferred - macOS File
  # Provider cannot virtualize a path the user chose, SF_DATALESS is unsettable
  # from user space, and macFUSE/fuse-t both fail the licence firewall (AD-130).
  #
  # SECOND PASS, 2026-08-22 (owner): FR-340..FR-345 and AD-131..AD-134 added.
  # Three deltas a spec author must not miss:
  #   (a) AD-131 NARROWS AD-126. For content created or modified locally the
  #       release clock starts at the SYNC-CONFIRMED edge, not last use, and
  #       such a path is not eligible at any age until that confirmation
  #       exists. The materialized ledger's at_ms is the materialization
  #       clock; synced_at_ms is a NEW column. Two clocks, one selector.
  #   (b) AD-132. The desktop app and keeper-syncd do NOT share a profile
  #       store (profiles table in sync.db vs [[profile]] in config.toml) or
  #       a data dir. Config both surfaces must honour lives in the folder
  #       TOML tier. Every new SyncProfileReq field is Option or it erases a
  #       daemon-set value (DW-116 verbatim).
  #   (c) AD-134. Adding a FilesSyncStatusVm variant is not done when the row
  #       renders: FilesDeletePlanVm::compose (vm.rs:4402-4422) would classify
  #       a virtual path as "stays on this machine" by default, so the delete
  #       confirmation would lie about a deletion that travels. 56.7 carries
  #       the test.
  # The first draft's claim that this tree refuses timer-driven work was WRONG
  # (docs/sync.md:889-893 refuses unattended BINARY replacement only), and its
  # success-edge citation engine.rs:3052-3066 was adopt_volume; the edge is
  # mark_synced, engine.rs:3185-3197. Both corrected in the epic.
