  # bare remote and two real keeper clones (/tmp/vf-e2e.sh, 10/10 checks):
  # pointer text arrives with the true oid and size, no object is fetched, a
  # below-floor path arrives whole, the tree stays clean, ls-files reports
  # 4194304 not ~130 bytes, materialize lands the bytes inline, an OPEN
  # descriptor REFUSES the release, and closing it releases back to the
  # pointer. That refusal is 56.11's /proc probe answering for real.
