[package]
name = "keeper-files-api"
description = "The files contract: a drive's manifest rows, the files commands, their refusals and the reference rules every implementation reproduces"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

# Types and pure rules only (story 116.1): no storage, transport, Syncular,
# SQLite, Tauri or keeper-core. `bun run check:module-edges` holds it to the
# contract role.
# The `_drive.toml` reader (117.1) brings `toml` and `globset`.
[dependencies]
keeper-accounts-api = { path = "../keeper-accounts-api" }
keeper-paths = { path = "../keeper-paths" }
globset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
