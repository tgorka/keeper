<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <title>keeper — the hex-bot</title>
  <!--
    THE KEEPER MARK. A honeycomb cell with a face: the hex-bot. keeper -> beekeeper -> the hive.
    A hive is many cells kept as one structure, which is literally what this product is — many
    networks bridged into one kept archive — and the keeper is the one who tends it. The face is
    the owner's decision, made deliberately against the earlier no-face draft: the eyes are what
    make the mark a SOMEONE in the menu bar rather than another rectangle, and the mouth is what
    makes it an instrument — it is the state display.

    Why this is not a bugdroid problem: Android's trademark is a dome head with two thin antennae
    and two dot eyes. This mark is a flat-topped hexagon, it wears NO antenna in any template
    (the antenna exists only on the coloured app icon, where it is a single stem tipped with a
    smaller hexagon — self-similar, not a feeler), and its mouth carries a state vocabulary no
    character mascot has. Silhouette, count and grammar all differ.

    THE GRID IS 44 UNITS, AND EVERY TEMPLATE COORDINATE IS EVEN. 44 -> 44px is 1:1 and
    44 -> 22px is exactly 0.5, and 22px is what macOS renders a menu-bar template at. Every
    horizontal and vertical edge here is a whole pixel at both tray sizes.

    A hexagon has diagonals, and a diagonal cannot land on whole pixels — this is the one trade
    this mark makes that the rectilinear tag it replaces did not, and it is made with open eyes:

      - All four diagonal edges have slope exactly 1:2 (8 across, 16 down), so the rasteriser
        antialiases them in one repeating two-row pattern instead of an irregular stagger. A
        consistent fringe reads as a crisp angle; an inconsistent one reads as mush.
      - Everything INSIDE the ring — eyes, mouth states, the sync ink the generator adds — is
        axis-aligned on even units and stays whole-pixel. The information is crisp; only the
        containing silhouette spends antialiasing, and it spends it identically in all glyphs.
      - The partial-pixel counts are still measured and PINNED in the generator and its test,
        per glyph. The budget is exact equality with the authored geometry, so an edge that
        drifts off the grid still fails the run — the gate did not relax, it re-based.

    The ring is 4 units thick on its horizontal bands (2px at 22) and ~3.6 on the diagonals —
    the perpendicular thinning of a parallel-offset 1:2 line, left uncorrected because a whole
    optical correction would cost the even grid on the inner contour.

    The face:

      - EYES, 4x4 at y14..18, symmetric about x22 with a 4-unit gap. 2x2px at 22 — the smallest
        crisp feature, same floor as the tag's eyelet. They are ink islands inside the cell, in
        every glyph, always open: they are the identity, not a state.
      - MOUTH, the state display, on the field x14..30 y22..34. It speaks the lamp's vocabulary:
        filled (live: a solid 8x6 mouth — recording, on the record), empty (idle: calm), dashed
        (working: three 4x4 dots — the "typing…" idiom, thinking), broken (fault: an exclamation,
        its point grounded on the chin). The generator drops sync facts onto the same field.

    The interior is ONE enclosed hole (two while the armed ring is up) and the eyes and mouth are
    islands in it. The identity still lives in the contrast between ink and hole; it is simply a
    cell with things kept inside it rather than a tag with holes punched out — which is, after
    all, the product.
  -->
  <defs>
    <!--
      The base mark, which is also the `idle` state: the hexagonal cell wall cut as an even-odd
      ring, and the two eyes. Outer hex 14,6 30,6 38,22 30,38 14,38 6,22 — 32x32, centred on the
      44 canvas at (0,0) translate. Inner hex offset 4 on the horizontals, same 1:2 slopes.
    -->
    <g id="mark-base">
      <path fill-rule="evenodd"
            d="M14 6H30L38 22L30 38H14L6 22Z M16 10H28L34 22L28 34H16L10 22Z"/>
      <rect x="16" y="14" width="4" height="4"/>
      <rect x="24" y="14" width="4" height="4"/>
    </g>

    <!--
      live — the mouth as a solid 8x6 core, the lamp's filled state. 4x3px at 22, dead centre,
      2 units clear of everything: a hex-bot with its mouth open on the record.
    -->
    <rect id="mouth-live" x="18" y="24" width="8" height="6"/>

    <!--
      working — three 4x4 dots across the mouth field, the lamp's dashed state and the oldest
      idiom in messaging: "typing…". The outer dots sit 1 unit off the inner diagonals at their
      lower corners; that unit is antialiased fringe, not a merge, and the pinned raster proves it.
    -->
    <g id="mouth-working">
      <rect x="14" y="24" width="4" height="4"/>
      <rect x="20" y="24" width="4" height="4"/>
      <rect x="26" y="24" width="4" height="4"/>
    </g>

    <!--
      fault — an exclamation: a 4x6 bar, a 2-unit gap, and a 4x4 point grounded on the chin
      (y30..34 ends exactly on the inner bottom edge, so the point is ink joined to the wall
      rather than a third island). The gap is the glyph: 1px at 22 between bar and point is what
      separates "!" from a stroke, and the grounded point is what separates fault from live.
    -->
    <g id="mouth-fault">
      <rect x="20" y="22" width="4" height="6"/>
      <rect x="20" y="30" width="4" height="4"/>
    </g>

    <g id="mark-idle"><use href="#mark-base"/></g>
    <g id="mark-live"><use href="#mark-base"/><use href="#mouth-live"/></g>
    <g id="mark-working"><use href="#mark-base"/><use href="#mouth-working"/></g>
    <g id="mark-fault"><use href="#mark-base"/><use href="#mouth-fault"/></g>

    <!--
      hero — the coloured-icon face, NEVER a template: the idle mark plus the three things that
      would be spent pixels at 22 and are personality at 64+. A smile (the menu bar's mouth is a
      state display and must be empty at rest; the app icon is not a status indicator, so it may
      be pleased to see you). An antenna: a 2-unit stem rising from the cell wall. And the stem's
      tip: a smaller hexagon — the mark broadcasting itself, self-similarity instead of ornament,
      and pointedly not a pair of feelers (see the bugdroid note above).

      Curves and off-grid coordinates are allowed here and only here: the hero ships exclusively
      through antialiased colour rasters (32px and up), where the whole-pixel doctrine does not
      apply.
    -->
    <g id="mark-hero">
      <use href="#mark-idle"/>
      <path d="M15 24Q22 31 29 24L29 27Q22 34 15 27Z"/>
      <rect x="21" y="-4" width="2" height="10"/>
      <path d="M20.2 -10.1L23.8 -10.1L25.6 -7L23.8 -3.9L20.2 -3.9L18.4 -7Z"/>
    </g>
  </defs>

  <!--
    Standalone, the file renders the idle face. That is the canonical mark and the state the app
    icon's hero is built from: calm, eyes open, mouth empty — present and keeping, reporting
    nothing, which is the only state an icon with no way to stay current should claim.
  -->
  <use href="#mark-idle" fill="#000"/>
</svg>
