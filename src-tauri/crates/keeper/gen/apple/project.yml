name: keeper
options:
  bundleIdPrefix: dev.tgorka.keeper
  deploymentTarget:
    iOS: 16.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: keeper
      PRODUCT_BUNDLE_IDENTIFIER: dev.tgorka.keeper
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  keeper_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: keeper_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      # The island (Story 65.5): the one file both targets compile. ActivityKit
      # matches the app's request to the extension's card by this type, so the
      # SAME file is listed here and under KeeperIsland's `sources` (a Target
      # Source may be one file; ProjectSpec.md, "Sources"). `Sources/keeper/
      # KeeperIsland.swift`, the bridge, is picked up by `Sources` above.
      - path: KeeperIsland/KeeperIslandAttributes.swift
    info:
      path: keeper_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        # Launch theming (Story 15.1, FR-59): the LaunchScreen background is the
        # `LaunchBackground` asset-catalog color (light #FFFFFF / dark #0A0A0A) so the
        # native launch matches the app's `--background` in both appearances with no flash.
        # UIUserInterfaceStyle is intentionally OMITTED (stays Automatic) so the launch
        # screen follows the system appearance, matching next-themes' defaultTheme="system".
        # Do NOT add UIUserInterfaceStyle here — it would pin one appearance and reintroduce
        # a launch flash for users on the other system theme.
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # Voice (Epic 62, Story 62.6, FR-408). Both strings are the sentence iOS shows in
        # its permission dialog, so each says what THIS app does with the audio. Declared
        # here, not in keeper_iOS/Info.plist, because `xcodegen generate` rewrites that file
        # from these properties (AD-32) and a key placed only there is silently reverted.
        # Apple: "If this key is not present, your app will crash when you call
        # requestAuthorization" (SFSpeechRecognizer.requestAuthorization(_:)).
        # The microphone string is ALSO in crates/keeper/Info.ios.plist, and must stay
        # equal to it: `tauri ios build` merges crates/keeper/Info.plist (the macOS
        # bundle's, "on this Mac") over this file's output, and Info.ios.plist is the
        # only later step in that merge.
        NSMicrophoneUsageDescription: keeper listens through the microphone only while you talk to a model you configured — after you tap Talk or say your wake phrase — and turns your words into text on this phone. Nothing is recorded or uploaded.
        NSSpeechRecognitionUsageDescription: keeper turns what you say into text on this phone, using on-device recognition only, so it can send your words to the model you chose. Your voice never leaves the device; keeper refuses server recognition.
        # Story 62.6 (the driving brief): a listening session ARMED in the foreground keeps
        # running when another app comes in front or the screen locks, because the audio
        # session is play-and-record and this mode is declared. What it does NOT buy: an app
        # cannot START recording from the background (Apple, "Configuring your app for
        # background audio"; DTS on forums thread 120038), so the phrase is armed by a tap
        # with keeper in front (FR-405), and iOS shows the microphone indicator the whole
        # time it is armed. This build is a Personal-Team sideload, never App Store, so
        # Guideline 2.5.4 is not a gate here — docs/ios.md.
        UIBackgroundModes: [audio]
        # The island (Epic 65, Story 65.5, AD-194): without this key
        # `Activity.request` throws `unsupported` and the lock screen shows nothing
        # of keeper's. Duplicated in crates/keeper/Info.ios.plist for the same
        # reason as the two sentences above — the build's plist merge is the last
        # word, and install-ios.sh reads the key off the installed bundle.
        NSSupportsLiveActivities: true
    entitlements:
      path: keeper_iOS/keeper_iOS.entitlements
      # Source of truth for the entitlements (Story 14.7, FR-65): XcodeGen REGENERATES
      # keeper_iOS.entitlements from these properties on every `xcodegen generate`, so a
      # value placed only in the checked-in .entitlements file would be silently reverted.
      # Default data protection MUST stay CompleteUntilFirstUserAuthentication — never
      # NSFileProtectionComplete, which would lock the SQLite WAL after screen lock and
      # stall a resumed sync loop. Pinned by crates/keeper/tests/entitlements_protection.rs.
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionCompleteUntilFirstUserAuthentication
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      # Voice (Story 62.4/62.6): this list is the ONLY thing that links Speech.
      # objc2-speech and objc2-avf-audio carry `#[link(kind = "framework")]` on EMPTY
      # extern blocks, and libapp.a is linked by this project, not by rustc, so those
      # attributes never reach the link line. AVFAudio still arrived on its own (the port
      # reads `AVAudioSessionCategoryPlayAndRecord`, a symbol ld resolves through the
      # AVFoundation Tauri already links); Speech is reached only by class name at run
      # time, so a project without it builds, ships every voice command, and has no
      # `SFSpeechRecognizer` (the port answers `NoRecognizer`). Run `xcodegen generate`
      # after editing — project.pbxproj must list them too, and once did not.
      - sdk: Speech.framework
      - sdk: AVFAudio.framework
      # The island (Story 65.5): `Sources/keeper/KeeperIsland.swift` imports
      # ActivityKit, and Swift autolinks what it imports, so this line is the
      # discipline of the two above rather than a necessity — the framework is
      # named where every other one is, and `otool -L` on the bundle proves it.
      - sdk: ActivityKit.framework
      # The widget extension that draws the Live Activity, embedded under
      # PlugIns/ (XcodeGen's `embed` defaults to true on an application target;
      # ProjectSpec.md, "Dependency"). Its shared attributes file is compiled
      # into this target through `sources` above.
      - target: KeeperIsland
    preBuildScripts:
      - script: bun tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # The island (Epic 65, Story 65.5, AD-194): the widget extension that draws
  # keeper's Live Activity in the Dynamic Island and on the lock screen. A
  # WidgetKit extension with no widgets — Apple's only door to a Live Activity
  # — so `NSExtensionPointIdentifier` is WidgetKit's. Its own bundle id, so on a
  # free Personal Team it is a second App ID (one of the ten a week) with its
  # own automatic profile that lapses with the app's (docs/ios.md). It declares
  # no entitlements: install-ios.sh's free-team strip has nothing to remove
  # here and must find no CODE_SIGN_ENTITLEMENTS afterwards. Deployment target
  # 16.2, above the app's 16.0: `ActivityContent` and `Activity.request(
  # attributes:content:pushType:)` are 16.2, and an older phone loads the app
  # without the extension. `SWIFT_VERSION` comes from XcodeGen's base preset
  # (5.0), the same one the app target gets. No scheme: it is built through the
  # app's. Regenerate with `xcodegen generate` after editing, and check
  # project.pbxproj lists `KeeperIsland.appex` under Embed Foundation Extensions.
  KeeperIsland:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: KeeperIsland
    info:
      path: KeeperIsland/Info.plist
      properties:
        CFBundleDisplayName: keeper
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tgorka.keeper.island
        # The team, without committing it (AD-32). tauri-cli writes
        # DEVELOPMENT_TEAM into the APP target's pbxproj configurations from
        # APPLE_DEVELOPMENT_TEAM at build time and touches no other target, so
        # the first install with this extension died at "Signing for
        # KeeperIsland requires a development team" (hesperia, 2026-09-05).
        # xcodebuild exposes its environment as build settings, and
        # scripts/install-ios.sh exports APPLE_DEVELOPMENT_TEAM inside the
        # dispatched build, so this resolves there; a plain Xcode run without
        # the variable will ask for a team in Signing & Capabilities, which is
        # the honest outcome for a project that stores none.
        DEVELOPMENT_TEAM: $(APPLE_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        ARCHS: [arm64]
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
        # An extension is a product of the app's archive, never its own
        # (Xcode's own extension template sets this).
        SKIP_INSTALL: true
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
