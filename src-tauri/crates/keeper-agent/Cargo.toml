[package]
name = "keeper-agent"
description = "keeper's one turn loop, drive tool host and task runner, shared by the app and the server (AD-367)"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

# AD-367: tauri-free, so both the app and a Linux host link it.
# `bun run check:agent-tauri-free` asserts it over `cargo tree`.
[dependencies]
keeper-core = { path = "../keeper-core" }
keeper-sync = { path = "../keeper-sync" }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The zone lock's file half: an exclusive lock a second process waits on.
fs4 = { workspace = true }
# The caller's clock, handed to a create (AD-56).
chrono = { workspace = true }
# An agent's room: the event ids and transaction ids its sends carry.
matrix-sdk = { workspace = true }
# BMAD's helpers, ported (AD-396): `bmad_config` and `bmad_party` read the
# drive's install through them, and print what they print in key order.
keeper-ported = { path = "../keeper-ported" }
toml = { workspace = true }
# A round's helpers run side by side on the turn's thread (R110). The MCP
# servers a host names for its agents (AD-406): one client per
# server, over streamable HTTP or, where the host may spawn, a child. The
# HTTP side is keeper's own bounded client over the workspace's reqwest
# (`mcp::http`), the child's pipes keeper's own transport with its output
# read through a bound, so no feature of rmcp's own HTTP, process or pipe
# layer is built. Every server is listed at once beside the manifest's
# renewal.
futures-util = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client"] }
sse-stream = { workspace = true }

# The headless host's process layer: no secret variable and no core dump
# after start (S-07), `prctl` on Linux; a `run`'s own process group, killed
# whole at its timeout.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

# A `run`'s sandbox on Linux, applied by the trampoline to itself before it
# execs the program (D-33): landlock for files and TCP, seccomp for sockets
# and the calls that reach into another process, nix to close what it
# inherited and to start the checked program by its descriptor
# (`execveat`, feature `process`).
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
seccompiler = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile = { workspace = true }
# The paced edits are tested on tokio's paused clock.
tokio = { workspace = true, features = ["test-util"] }
# A served session's second turn opens no file under log/: counted by inotify.
notify = { workspace = true }
# What a decision path writes to the process log, captured: a rejected
# value never reaches it.
tracing-subscriber = { workspace = true }
# An index that opens and cannot answer, made by renaming its table
# (drive_search). keeper-core already links it: no new crate.
rusqlite = { workspace = true }
# In-test MCP servers, spoken to over a real HTTP port and a real child.
rmcp = { workspace = true, features = ["server", "elicitation", "transport-io", "transport-streamable-http-server"] }
axum = { workspace = true }
