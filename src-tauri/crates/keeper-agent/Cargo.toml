[package]
name = "keeper-agent"
description = "keeper's client half of the agents: the sessions runtime, promotion and the surface (AD-367, R-HQ-2)"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

# AD-367: tauri-free, so it stays a library the app links on every target.
# `bun run check:agent-tauri-free` asserts it over `cargo tree`.
[dependencies]
keeper-core = { path = "../keeper-core" }
keeper-sync = { path = "../keeper-sync" }
tracing = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The zone lock's file half: an exclusive lock a second process waits on.
fs4 = { workspace = true }
# The caller's clock, handed to a create (AD-56).
chrono = { workspace = true }

# The journaled executor's folder handles: `openat`, `renameat` and `fsync`
# on a held directory, so a plan's steps stay inside the zone it opened.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
# What a decision path writes to the process log, captured: a rejected
# value never reaches it.
tracing-subscriber = { workspace = true }
# A session's `agent.toml` names its people and room by Matrix id
# (`keeper_core::agents::session`, R-HQ-69); the promote tests build them.
matrix-sdk = { workspace = true }
