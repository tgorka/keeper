[package]
name = "keeper-replica"
description = "Syncular adapter of the keeper replica port"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
keeper-ports = { path = "../keeper-ports" }
syncular-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# The file transfer (story 115.3): presigned `PUT`/`GET` to the object store,
# streamed from and to disk. ureq 3 is already linked through syncular-client's
# `native-transport`, so no new crate; MIT OR Apache-2.0.
ureq = "3.5"
base64 = { workspace = true }

[features]
# The outcome journal's test writer (`journal`). Only keeper-core's
# `[dev-dependencies]` enable it; nothing shipped does.
outcome-journal = []
# A test seam: `SyncularReplica::write_then_fault` ends the owner after a
# write, as a fault would. Only keeper-core's `[dev-dependencies]` enable it.
owner-fault = []

[dev-dependencies]
keeper-testkit = { path = "../keeper-testkit" }
tempfile = { workspace = true }
tungstenite = "0.30"
