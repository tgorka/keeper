[package]
name = "keeper-graph-query"
description = "Single-use confined source-built graph proof worker"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
keeper-graph-protocol = { path = "../keeper-graph-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true, features = ["hooks", "limits"] }
libsqlite3-sys = { version = "=0.38.2", features = ["bundled"] }
# `stats` only adds relaxed counters (max/total) inside the same audited alloc paths.
cap = { version = "=0.1.2", features = ["stats"] }
nix = { version = "=0.31.3", default-features = false, features = ["resource"] }
rustix = { version = "=1.1.4", features = ["process", "fs"] }
sha2 = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
seccompiler = "=0.5.0"

[build-dependencies]
cc = "1"

[features]
# Only the separate proof executables below enable this. The shipped worker binary is
# built without it, so its sole entry is `engine::start`.
proof-executables = []

[[example]]
name = "native_probe"
required-features = ["proof-executables"]

[[example]]
name = "allocation_probe"
required-features = ["proof-executables"]

[[example]]
name = "budget_probe"
required-features = ["proof-executables"]
