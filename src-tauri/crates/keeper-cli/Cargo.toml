[package]
name = "keeper-cli"
description = "keeper without a window: one command line, `keeper-cli <module> <verb> [--json]`; its first module is the headless app-human consumer of keeper's graph against a real keeper-hq"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

# The binary is `src/main.rs`, discovered by cargo under the package's name
# (`keeper-cli`: the shell already builds `keeper`). No `[[bin]]` and no
# `[[example]]` table: `scripts/check-graph-boundary.py` refuses either here.

[lints]
workspace = true

# The one `human-reads` enabler of the workspace (`scripts/check-graph-boundary.py`).
# keeper-syncd's conventions (`--json`, one stdout writer, exit codes 0-4) are
# followed here without depending on it.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
keeper-graph = { path = "../keeper-graph", features = ["human-reads"] }
keeper-ports = { path = "../keeper-ports" }
# `accounts domains` (story 114.5): the view model it prints, and the
# contract's entry types its tests read the vectors with.
keeper-accounts = { path = "../keeper-accounts" }
keeper-accounts-api = { path = "../keeper-accounts-api" }
keeper-replica = { path = "../keeper-replica" }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Only the P1 measurement example `rc_spawner` (never shipped) uses these.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["resource"] }
sha2 = { workspace = true }
keeper-testkit = { path = "../keeper-testkit" }
tempfile = { workspace = true }
