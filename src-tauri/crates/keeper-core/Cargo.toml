[package]
name = "keeper-core"
description = "Keeper hexagon core — Matrix state, IPC view models, and platform ports (tauri-free)"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ts-rs = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# Homed here as the architectural owner (AD-6); not yet exercised in Story 1.1.
matrix-sdk = { workspace = true }
matrix-sdk-ui = { workspace = true }
# `AttachmentDecryptor`: an agent's download of a person's encrypted file is
# read through a bound, then decrypted and checked here (R444).
matrix-sdk-crypto = { workspace = true }
# The room's info observable, by name (`Room::subscribe_info`): an agent
# room's timeline draws its briefs again when its members or power change
# (R117). Already resolved in Cargo.lock via matrix-sdk; no new package.
eyeball = "0.8"
# QR-code SVG rendering for device-verification display (Story 3.2). Renders the
# `qrcode::QrCode` from `QrVerification::to_qr_code()` to an SVG string in Rust —
# the webview never decodes QR crypto.
qrcode = { workspace = true }
# Async stream adapters for the room-list producer task.
futures-util = { workspace = true }
# URL parsing for the OIDC callback registry and OAuth redirect metadata.
url = { workspace = true }
# Percent-decoding `keeper-media://` URL path segments (Story 3.6, AD-4).
percent-encoding = { workspace = true }
# MIME parsing (media send caption/type) + path→mime guessing (Story 3.7, FR-13).
mime = { workspace = true }
mime_guess = { workspace = true }
# HTTP client for the Beeper unofficial email-code login flow (Story 2.3, AD-17).
reqwest = { workspace = true }
# The organisation account's OIDC client (Epic 82, AD-310). See the workspace
# manifest for why default features are off; `oauth2-reqwest` runs it on the
# reqwest above, so no second HTTP or TLS stack enters the tree.
openidconnect = { workspace = true }
oauth2-reqwest = { workspace = true }
# Account registry (keeper.db, WAL) and opaque ULID account ids.
rusqlite = { workspace = true, features = ["hooks"] }
# Derived notes chunk identities; already locked transitively (AD-261).
blake3 = { workspace = true }
ulid = { workspace = true }
# Random per-account SDK-store passphrase generation (Story 2.6, at-rest encryption).
# Already resolved in the lock as rand 0.8 (oauth2, openidconnect); permissive (MIT/Apache).
rand = "0.8"
# The phone's release check reads GitHub's latest tag as a strict SemVer 2.0
# version (story 102.9, R482). Already locked in the tree (tauri-utils,
# tauri-plugin-updater), `MIT OR Apache-2.0`, no tauri or gix behind it.
semver = "1"
# The `path:` predicate of the space query language (Phase 5, FR-105). The
# architecture specifies a globset glob, and `keeper-sync`'s tier-0 exclusion
# already resolves the same workspace version, so this pulls no new crate into
# the tree. `Unlicense OR MIT` — the MIT arm satisfies the licence firewall, and
# it drags in neither tauri nor gix, so `check:core-tauri-free` and
# `check:core-sync-free` stay green.
globset = { workspace = true }
# Reading DOCX, PPTX and XLSX (Story 45.8, FR-181, FR-182). Those three formats
# are a ZIP of XML, so the whole of `document.rs` is these two crates plus a
# pile of caps. Both are already compiled in every keeper build — `zip` via
# tauri-plugin-updater, `quick-xml` via plist <- tauri-utils — so this adds no
# new package to Cargo.lock, and the alternative was ~1.2 MB of JavaScript
# parsers in the bundle. Neither drags in tauri or gix, so
# `check:core-tauri-free` and `check:core-sync-free` stay green. See the
# workspace manifest for the feature choices and the decompression caveat.
zip = { workspace = true }
quick-xml = { workspace = true }
flate2 = { workspace = true }
# The layer stack's on-disk format (Story 46.6, AD-98/AD-99). Already resolved
# in Cargo.lock as `keeper-syncd`'s profile-config parser, so this adds no new
# package to the tree, and it is the same parser the daemon's `[[profile]]`
# tables go through — one TOML dialect across the product, not two. MIT OR
# Apache-2.0, and it drags in neither tauri nor gix, so `check:core-tauri-free`
# and `check:core-sync-free` stay green.
toml = { workspace = true }
# The `keeper-media` block's marker edits (Epic 88, AD-354): `toml` reads a
# body, `toml_edit` changes one `[[marker]]` table and keeps every other byte.
toml_edit = { workspace = true }
# The one `data:` URI this crate mints: a pasted image's bytes, base64'd at the
# moment the outbound chat request is built, because Ollama's OpenAI layer
# accepts an image only that way ("Image URL ✘ / Base64 encoded image ✔",
# Story 61.12, `bots::deliverable::image_data_uri`). Already a workspace
# dependency and already resolved in Cargo.lock for the LFS Basic-auth header,
# so this adds no new package to the tree. MIT OR Apache-2.0, and it drags in
# neither tauri nor gix, so `check:core-tauri-free` and `check:core-sync-free`
# stay green.
base64 = { workspace = true }
# The Android secret store (Epic 98, story 98.3 #2, `secret_file`): the format
# and its AEAD live here so they are tested on Linux with a fake key provider.
# Already in the lock (matrix-sdk-store-encryption); Apache-2.0 OR MIT; tauri-
# and gix-free.
chacha20poly1305 = { workspace = true }
# Wake-phrase normalisation (Epic 62, Story 62.4, FR-404): NFD decomposition
# plus combining-mark removal is how `voice::phrase` makes "Hej Kééper" and
# "hej keeper" the same phrase. Already resolved in Cargo.lock as matrix-sdk's
# own transitive dependency (`idna`), so this adds no package to the tree, and
# it drags in neither tauri nor gix, so `check:core-tauri-free` and
# `check:core-sync-free` stay green. MIT OR Apache-2.0.
unicode-normalization = { workspace = true }
# Upstream code rewritten in Rust (Epic 89, AD-396): BMAD's customization
# merge feeds `agents::soul::soul_from_bmad`, agentskills' validator feeds
# `agents::skills`. A pure path crate — no network, no runtime, no tauri.
keeper-ported = { path = "../keeper-ported" }
# OpenAI-compatible streaming, the provider quirks and the tool loop (AD-431),
# re-exported at their old `bots::*` paths. An open crate with no keeper
# dependency (`bun run check:llm-lean`).
keeper-llm = { path = "../keeper-llm" }
# Digests of an agent's composed prompt and memory snapshot, and the session
# log's blob names (Epic 89, AD-363, AD-366). Both already resolved in
# Cargo.lock for keeper-sync's LFS hashing, so the tree gains no package.
sha2 = { workspace = true }
hex = { workspace = true }
# Secret redaction before an agent's log line is written (Epic 89, S-17), and
# before a WARN/ERROR message leaves for PostHog (R461, `telemetry::redact`).
regex = { workspace = true }
# OTLP protobuf wire encoding for the closed consent-gated observability schema.
# Already resolved via Matrix.
prost = "0.14"
# The `Layer` the shell installs to forward WARN/ERROR events to telemetry
# (R461, `telemetry::LogExport`); the tests read a failed account step's WARN
# back from a real `fmt` subscriber (Epic 100). Already in the workspace
# catalog and linked by every host, so no new crate is resolved.
tracing-subscriber = { workspace = true }
# The agents' database (AD-418, AD-421): one replica per database the device's
# token opens, each driven on its own owner thread (`hq`). The port is
# `hq::port`; this crate is its one adapter (`hq::syncular`). tauri- and
# gix-free; its SQLite is the workspace's rusqlite.
syncular-client = { workspace = true }

[dev-dependencies]
# The privacy lifecycle tests observe real localhost connection/cancellation;
# the display-name bound is measured on tokio's paused clock.
tokio = { workspace = true, features = ["net", "test-util"] }
# Epic 82's OIDC tests sign ID tokens with an RSA key generated per test run
# (no private key is checked in). Already in the graph via `openidconnect`.
rsa = "0.9"
# The UnifiedPush discovery test's local HTTPS server (98.4 #2): a gateway is
# https only, so the fixture speaks TLS with a certificate made per run. The
# TLS stack reqwest already uses; all three are in Cargo.lock (keeper-agent).
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# The timeline tests' event-cache store that can pause a page under the
# cache's lock: the `EventCacheStore` trait and its in-memory store, which
# `matrix-sdk` does not re-export. Already in the tree through it.
matrix-sdk-base = "0.19"
# The region difference hash's bounds are proved over real screenshots of
# the Mac (PNG fixtures, 96.4 #5); the hash itself takes grey bytes.
image = { workspace = true }
# The container move's tests (Epic 98) move real directories; already in the
# graph through keeper-sync.
tempfile = { workspace = true }
