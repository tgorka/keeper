[package]
name = "keeper-testkit"
description = "Replica test doubles and adapter fixtures for development only"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
keeper-ports = { path = "../keeper-ports" }
keeper-files-api = { path = "../keeper-files-api" }
keeper-accounts-api = { path = "../keeper-accounts-api" }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
rusqlite = { workspace = true }
# Content addresses of the fake's blob bodies (`sha256:<hex>`).
sha2 = { workspace = true }
hex = { workspace = true }
# The harness's replica files.
tempfile = { workspace = true }
# The stand-in object store (`store`, story 115.3): part checksums, plan ids.
base64 = { workspace = true }
# The stand-in store's small receive window, so loopback buffers like a real link's.
socket2 = { version = "0.6", features = ["all"] }
