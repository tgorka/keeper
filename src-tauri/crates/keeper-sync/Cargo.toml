[package]
name = "keeper-sync"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
description = "Git-protocol folder synchronization engine for keeper (AD-40 … AD-53)"

# AD-40: this crate is deliberately BOTH `tauri`-free and `keeper-core`-free.
#  * tauri-free  — so `keeper-syncd` can link it on a headless server.
#  * core-free   — so the standalone daemon never inherits matrix-sdk, and so
#                  the iOS build never inherits gitoxide.
# `bun run check:core-sync-free` asserts the reverse edge (keeper-core must
# never name gix or keeper-sync).
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
ulid = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
gix = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
globset = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }
# Exact-Content-Length streaming bodies for LFS uploads — see the workspace
# manifest for why `wrap_stream` cannot be used. Adds no new crate.
http-body = { workspace = true }
bytes = { workspace = true }
# HTTP Basic for the LFS endpoints (`credential.rs`). git-lfs speaks plain
# `Authorization: Basic`, with no credential helper in the way to encode it —
# unlike `git` itself, which is why this is needed here and nowhere else.
# Already resolved in this crate's own tree via gix-transport and reqwest, so a
# direct dep adds no new crate. MIT/Apache — passes `cargo deny check`.
base64 = { workspace = true }
# Reading back the pattern field of a `.gitattributes` line keeper wrote for a
# path containing a space (`lfs::stage`). See the workspace manifest for why
# quoting is mandatory and why this crate rather than a hand-rolled decoder.
# Adds no new crate: gix-attributes already depends on it.
gix-quote = { workspace = true }
# The pack writer behind `git::push_http` (Story 66.5, AD-202): `generate` is
# the feature `gix` leaves off, and the phone cannot spawn `git push`. See the
# workspace manifest. Adds no new crate.
gix-pack = { workspace = true }
# The folder tier: `<folder>/.keeper/keeper.toml` and its `keeper.<host>.toml`
# sibling, read at profile-load time (`profile::folder`, AD-99/AD-100). Adds no
# new crate — `keeper-syncd` already resolves it for the daemon's own
# `[[profile]]` config, and this crate now owns the profile↔TOML mapping the
# two of them share. MIT/Apache — passes `cargo deny check`.
toml = { workspace = true }

# The FIRST platform-conditional dependency in this crate, and it is macOS-only
# on purpose: AD-40 requires `keeper-syncd` to keep linking this crate on a
# headless Linux server, which a macOS-gated edge does not disturb.
#
# `files_write::finder_trash` (Story 46.14, AD-102, NFR-30) sends an
# out-of-vault delete to the OS trash rather than an `unlink`. On macOS that is
# `NSFileManager trashItemAtURL:resultingItemURL:error:`, a SAFE objc2 binding —
# no `unsafe` block, nothing to add to the audited-FFI inventory in
# `docs/constraints-and-limitations.md`. Everywhere else the freedesktop.org
# home trash is implemented in the module itself, which is what makes the
# removal testable on the Linux box this is written on.
#
# Adds no new crate and no new crate version: objc2-foundation 0.3 / objc2 0.6
# are already resolved in the lock via tao/wry/muda, and the `keeper` crate
# already names them for the iOS backup-exclusion FFI. Only the dependency edge
# and the `NSFileManager` feature are new. MIT — passes `cargo deny check`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

# `openfiles` raises RLIMIT_NOFILE at startup, because a Finder-launched app
# inherits launchd's 256 and gitoxide's object store needs more than that.
# A wrapper rather than `libc` directly: this crate denies `unsafe_code`, and
# one syscall is not worth an exception to that.
[target.'cfg(unix)'.dependencies]
rlimit = "0.10"
