# cargo-deny configuration — license firewall for an Apache-2.0 project.
# Run: cargo deny check (from src-tauri/)

[graph]
all-features = false

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
# AGPL/GPL code must never be linked into the client.
#
# The allow-list above is exhaustive, so an honestly-declared GPL crate already
# fails. These two entries exist because the allow-list is NOT sufficient for
# them: `git2` and `libgit2-sys` declare "MIT OR Apache-2.0" in their Cargo
# metadata while vendoring libgit2, whose actual COPYING is GPL-2.0 with a
# linking exception. cargo-deny reads the metadata, so the check would go green
# while GPLv2 C code linked into keeper. The folder-sync engine (AD-41) is
# built on gitoxide (MIT OR Apache-2.0) precisely to avoid this, and shells out
# to the `git` binary for the four operations gitoxide does not implement —
# invoking a program is not linking, so the firewall holds.
deny = [
  { crate = "git2", reason = "vendors GPL-2.0-with-linking-exception libgit2 while declaring MIT/Apache — use gix (AD-41)" },
  { crate = "libgit2-sys", reason = "GPL-2.0-with-linking-exception C, mis-declared as MIT/Apache in crate metadata" },
]

[advisories]
yanked = "warn"
# 2026-10-25: waiver, not a fix; only >=0.7.6 is patched, and the latest
# openidconnect (4.0.1) still pins p256/p384 0.13 -> crypto-bigint 0.5.
# OIDC verifies provider signatures using public EC inputs; no EC private-key
# signing or key agreement. Re-audit this exception before adding either.
# Other waivers reviewed 2026-10-25; removal criteria and dependency owners are
# recorded in docs/constraints-and-limitations.md, "RustSec waivers and maintenance follow-ups".
# No blanket severity or unmaintained suppression: new advisories still fail.
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "EC signature verification on public inputs only via openidconnect; no secret-integer use; https://github.com/tgorka/keeper/issues/576" },
  { id = "RUSTSEC-2023-0071", reason = "WAIVER 2026-10-25: rsa 0.9.10 has no upstream fix. Production openidconnect verifies public-key signatures only; keeper's private-key signing is cfg(test). Revisit before adding RSA private-key operations." },
  { id = "RUSTSEC-2026-0367", reason = "WAIVER 2026-10-25: zip 4 is required by tauri-plugin-updater. keeper-core reads bounded OOXML parts without extraction; updater ZIP extraction is Windows-only and receives signature-verified releases. Unix SUID/SGID extraction is not reached. Remove when updater supports zip >=9." },
  { id = "RUSTSEC-2026-0368", reason = "WAIVER 2026-10-25: keeper-core never extracts ZIP entries. Windows updater does extract, but only release archives verified by its configured minisign key; a malicious signed release remains a trusted-publisher risk. Updater requires zip ^4; remove when it supports zip >=9." },
  { id = "RUSTSEC-2026-0369", reason = "WAIVER 2026-10-25: keeper-core never extracts ZIP entries; updater extraction is Windows-only, not the affected Unix permission path, and accepts signature-verified releases. Updater requires zip ^4; remove when it supports zip >=9." },
  { id = "RUSTSEC-2026-0319", reason = "WAIVER / FOLLOW-UP 2026-10-25: anymap2 is pulled by matrix-sdk 0.19.1. Track the SDK's migration to a maintained map; do not replace SDK internals in this lockfile lane." },
  { id = "RUSTSEC-2024-0370", reason = "WAIVER / FOLLOW-UP 2026-10-25: proc-macro-error is pulled by glib-macros and gtk3-macros in Tauri's Linux GTK3 stack. Track an upstream GTK/Tauri migration; no crate substitution in this lane." },
  { id = "RUSTSEC-2025-0081", reason = "WAIVER / FOLLOW-UP 2026-10-25: unic-char-property is pulled through unic-ucd-ident -> urlpattern -> tauri-utils. Track urlpattern's Unicode dependency migration." },
  { id = "RUSTSEC-2025-0075", reason = "WAIVER / FOLLOW-UP 2026-10-25: unic-char-range is pulled through unic-ucd-ident -> urlpattern -> tauri-utils. Track urlpattern's Unicode dependency migration." },
  { id = "RUSTSEC-2025-0080", reason = "WAIVER / FOLLOW-UP 2026-10-25: unic-common is pulled through unic-ucd-version -> unic-ucd-ident -> urlpattern -> tauri-utils. Track urlpattern's Unicode dependency migration." },
  { id = "RUSTSEC-2025-0100", reason = "WAIVER / FOLLOW-UP 2026-10-25: unic-ucd-ident is pulled by urlpattern in tauri-utils. Track urlpattern's Unicode dependency migration." },
  { id = "RUSTSEC-2025-0098", reason = "WAIVER / FOLLOW-UP 2026-10-25: unic-ucd-version is pulled through unic-ucd-ident -> urlpattern -> tauri-utils. Track urlpattern's Unicode dependency migration." },
  { id = "RUSTSEC-2026-0371", reason = "WAIVER / FOLLOW-UP 2026-10-25: zbus_names is pulled by zbus/zbus_macros through notify-rust and tauri-plugin-opener. Track their migration to zbus 6, which incorporates these APIs." },
  { id = "RUSTSEC-2026-0370", reason = "WAIVER / FOLLOW-UP 2026-10-25: zvariant is pulled by zbus/zbus_macros/zbus_names through notify-rust and tauri-plugin-opener. Track their migration to zbus 6; no D-Bus stack replacement here." },
  { id = "RUSTSEC-2026-0372", reason = "WAIVER / FOLLOW-UP 2026-10-25: zvariant_derive is pulled by zvariant in the zbus 5 stack through notify-rust and tauri-plugin-opener. Track their migration to zbus 6." },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
# The gitoxide fork keeper's `gix` is pinned to: the upstream
# `gix-filter-v0.33.0` tag plus `impl Drop for State`, so `process` filters are
# reaped instead of leaking one child per pipeline. Same MIT OR Apache-2.0 as
# the crates.io release it is cut from — see the long note in Cargo.toml, and
# drop this line when the fix ships upstream.
allow-git = ["https://github.com/tgorka/gitoxide"]
