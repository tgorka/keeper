# cargo-deny configuration — license firewall for an Apache-2.0 project.
# Run: cargo deny check (from src-tauri/)

[graph]
all-features = false

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
# AGPL/GPL code must never be linked into the client.
#
# The allow-list above is exhaustive, so an honestly-declared GPL crate already
# fails. These two entries exist because the allow-list is NOT sufficient for
# them: `git2` and `libgit2-sys` declare "MIT OR Apache-2.0" in their Cargo
# metadata while vendoring libgit2, whose actual COPYING is GPL-2.0 with a
# linking exception. cargo-deny reads the metadata, so the check would go green
# while GPLv2 C code linked into keeper. The folder-sync engine (AD-41) is
# built on gitoxide (MIT OR Apache-2.0) precisely to avoid this, and shells out
# to the `git` binary for the four operations gitoxide does not implement —
# invoking a program is not linking, so the firewall holds.
deny = [
  { crate = "git2", reason = "vendors GPL-2.0-with-linking-exception libgit2 while declaring MIT/Apache — use gix (AD-41)" },
  { crate = "libgit2-sys", reason = "GPL-2.0-with-linking-exception C, mis-declared as MIT/Apache in crate metadata" },
]

[advisories]
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
