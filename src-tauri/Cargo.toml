[workspace]
resolver = "2"
members = ["crates/keeper-core", "crates/keeper", "crates/keeper-sync", "crates/keeper-syncd"]

[workspace.package]
version = "0.6.0"
authors = ["Tomasz Gorka"]
license = "Apache-2.0"
repository = "https://github.com/tgorka/keeper"
edition = "2021"

# Shared lints — single source of truth; each crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[workspace.dependencies]
# Tauri shell. The `tray-icon` feature backs the opt-in menu-bar presence (Story 10.3,
# FR-53); the dock-badge port uses the in-core `set_badge_count` API (no extra feature).
# The feature is desktop-only and is added by the `keeper` crate through a
# target-gated dependency entry (Story 12.2) — Cargo target tables only understand
# real target cfgs, so the base workspace dep stays featureless-of-tray here.
tauri = { version = "2" }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
# OS-level global summon/hide hotkey (Story 9.4, FR-50). Desktop-only platform port;
# registration/unregistration happen only in Rust. MIT/Apache — passes `cargo deny check`.
tauri-plugin-global-shortcut = "2"
# Native OS notifications from the sync loop (Story 10.1, FR-51). The desktop
# `Platform::notify` port posts through this; content originates only from the local
# decrypting loop, never a push gateway. MIT/Apache — passes `cargo deny check`.
tauri-plugin-notification = "2"
# Opt-in launch-at-login via a macOS LaunchAgent (Story 10.3, FR-53, AD-25). The plugin
# owns the enabled state authoritatively; off by default. Apache/MIT — passes `cargo deny`.
tauri-plugin-autostart = "2"
# Signed auto-updates (Story 11.2, NFR-12). The updater checks the GitHub-releases
# `latest.json` endpoint and verifies each artifact against the committed minisign public
# key before installing; `tauri-plugin-process` supplies `relaunch()` after an update.
# Both are MIT/Apache — pass `cargo deny check`.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Serialization + IPC bindings
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
# Async runtime + observability
# `fs` was added for the folder-sync phase: the LFS transfer path streams
# multi-GB objects off disk inside an async body, and `std::fs` there would
# block the reactor for every chunk (AD-46, NFR-23).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
# Matrix core (homed in keeper-core; unused in 1.1 but owned here per AD-6)
matrix-sdk = { version = "0.18", features = ["e2e-encryption", "qrcode", "sqlite", "sso-login"] }
matrix-sdk-ui = "0.18"
# QR-code rendering for device-verification *display* (Story 3.2). The matrix-sdk
# `qrcode` feature (above) pulls this same crate for `QrVerification::to_qr_code`;
# depended on directly for the `svg` renderer. `default-features = false` drops
# the `image`/`pic` renderers so no image codecs are linked. MIT/Apache — passes
# `cargo deny check`.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Async stream adapters for the room-list producer (already in the tree via matrix-sdk).
futures-util = "0.3"
# URL parsing for the OIDC callback registry + redirect metadata (already in the tree via matrix-sdk).
url = "2"
# Percent-decoding `keeper-media://` URL path segments (Story 3.6). Already in the
# tree via url/matrix-sdk — a direct dep adds no new crate; permissive (MIT/Apache).
percent-encoding = "2"
# MIME type parsing/matching (Story 3.7, media send). Already in the tree via
# matrix-sdk; a direct dep adds no new crate. MIT/Apache — passes `cargo deny check`.
mime = "0.3"
# Guessing a MIME type from a file path/extension for the media send path (Story
# 3.7). Returns a `mime::Mime`; `application/octet-stream` fallback. MIT — passes
# `cargo deny check`.
mime_guess = "2"
# HTTP client for the Beeper unofficial email-code login flow (Story 2.3, AD-17).
# rustls-only to match matrix-sdk's TLS backend — no second TLS stack (no native-tls/OpenSSL).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# Platform ports
dirs = "6"
# Destination free-space probe for the recording validate-on-Start pre-flight
# (Story 19.5). Shell-only — keeper-core holds the pure `evaluate_destination`
# decision and no filesystem-probe dependency (AD-33). The default `sync`
# feature is exactly the blocking `fs4::available_space` statvfs probe; no
# async runtime integration is pulled in. Apache-2.0/MIT — passes `cargo deny check`.
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
# Local-time-stamped recording filenames (Story 16.6, FR-71) — clock-only, no
# default features (no oldtime/wasm baggage). MIT/Apache — passes `cargo deny check`.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Keychain (macOS Keychain via the OS-native backend) — shell-only, the only genuinely new crate.
keyring = { version = "3", features = ["apple-native"] }
# iOS keychain fallback (Story 12.3, AD-29). Catalog entry only — 3.7.0 is already
# resolved in the lock via keyring, so no new crate version is pulled; the only Cargo.lock
# change is the dependency edge recorded on the `keeper` crate, and the desktop dep tree /
# build stay byte-identical. Consumed by the `keeper` crate under an iOS-only target table
# to pin `AfterFirstUnlockThisDeviceOnly`. MIT/Apache — passes the cargo-deny license firewall.
security-framework = "3"
# iOS backup exclusion (Story 14.7, FR-65, AD-29). Catalog entries only — objc2 0.6 /
# objc2-foundation 0.3 are already resolved in the lock transitively (tao/wry/muda), so no
# new crate version is pulled; the only Cargo.lock change is the dependency edge on the
# `keeper` crate. Consumed under an iOS-only target table for the single audited
# `NSURLIsExcludedFromBackupKey` FFI behind `Platform::exclude_from_backup`. The feature
# list names exactly the Foundation surfaces that call touches (NSURL + its NSError result,
# NSString path, NSNumber value). MIT — passes the cargo-deny license firewall.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSError", "NSString", "NSValue"] }
# iOS app-icon badge (Story 14.3 fix, FR-62): safe `UNUserNotificationCenter::setBadgeCount`
# binding (block2 feature for the optional completion handler). Already resolved in the lock
# transitively; MIT — passes the cargo-deny license firewall.
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "block2"] }
# Account registry + opaque account ids (both already present transitively via matrix-sdk).
ulid = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

# ---------------------------------------------------------------------------
# Folder Sync phase (Epics 23–31, AD-40 … AD-53). Consumed by `keeper-sync`
# (the engine) and `keeper-syncd` (the standalone Linux daemon). None of these
# may ever appear in `keeper-core`'s tree — `bun run check:core-sync-free`
# enforces that mechanically.
# ---------------------------------------------------------------------------
# gitoxide: clone, fetch, checkout, status, index, objects, commits,
# .gitattributes/filters, progress and interruption (AD-41). `default-features
# = false` keeps the tree lean, but a hash feature is MANDATORY — omitting
# `sha1` fails the build inside gix-hash with non-exhaustive-match errors.
# `blocking-http-transport-reqwest-rust-tls` resolves onto the same reqwest
# 0.13 the Beeper client already uses, so no second TLS stack is linked.
# Push, worktree mutation, sparse-checkout patterns and gc are NOT implemented
# upstream and are not planned (issue #306 closed NOT_PLANNED 2026-07-22);
# those four shell out to the `git` binary via `keeper_sync::git::cli`.
# MIT OR Apache-2.0 — passes `cargo deny check`.
gix = { version = "0.86", default-features = false, features = [
    "sha1",
    "blocking-http-transport-reqwest-rust-tls",
    "credentials",
    "attributes",
    "worktree-mutation",
    "status",
    "index",
    "dirwalk",
    "excludes",
    "revision",
    "blob-diff",
    "parallel",
    "progress-tree",
    "tracing",
] }
# Filesystem watching for sync watch mode (Story 26.2). inotify on Linux —
# including IN_CLOSE_WRITE, which shortens the quiescence window — FSEvents on
# macOS, and a PollWatcher fallback for network/FUSE mounts. CC0-1.0, which is
# on the deny.toml allow-list.
notify = "8"
# Event debouncing + rename correlation on top of `notify` (Story 26.2).
# MIT OR Apache-2.0 — passes `cargo deny check`.
notify-debouncer-full = "0.7"
# Tier-0 name/shape exclusion for the completeness gate (Story 26.1): one
# compiled glob set for the industry partial-download/lock-file conventions
# plus per-profile excludes. `Unlicense OR MIT` — the MIT arm satisfies the
# firewall. Already resolved in the lock transitively.
globset = "0.4"
# Content verification (Stories 25.1, 25.3, 26.5): SHA-256 for LFS object OIDs
# and verify-on-read. Already resolved in the lock transitively via
# vodozemac/matrix-sdk, so a direct dep pulls no new crate version. Hardware
# SHA-NI / ARMv8-SHA2 is selected at runtime through `cpufeatures`; the `asm`
# feature is deliberately NOT enabled (it would add a C build).
sha2 = "0.10"
hex = "0.4"
# Atomic staging for LFS objects, index writes and the volume marker
# (tmp-then-rename, the recording manifest precedent). Already in the lock.
# MIT OR Apache-2.0.
tempfile = "3"
# CLI argument parsing for `keeper-syncd` only (Story 30.1). Not linked into
# the Tauri app. MIT OR Apache-2.0 — passes `cargo deny check`.
clap = { version = "4", features = ["derive", "env"] }
# `keeper-syncd`'s on-disk profile configuration (Story 30.2). MIT OR
# Apache-2.0 — passes `cargo deny check`.
toml = "0.9"
# Exact-length streaming request bodies for LFS uploads (Story 25.3). This is
# not optional sugar: `reqwest::Body::wrap_stream` and `Body::from(File)` both
# yield an unknown-size body and therefore `Transfer-Encoding: chunked`, which
# pre-signed S3 PUTs (Forgejo's SERVE_DIRECT mode) reject. The fix is
# `Body::wrap` over an `http_body::Body` whose `size_hint()` is
# `SizeHint::with_exact(size)`, so `RequestBuilder` sets a real
# `Content-Length` — without ever buffering the object. Both crates are
# already resolved in Cargo.lock as reqwest's own dependencies, so this adds
# no new crate to the tree. MIT (http-body) / MIT (bytes).
http-body = "1"
bytes = "1"
