# Git hooks managed by lefthook (https://lefthook.dev)
# Hooks are installed automatically on `bun install` (package.json "prepare" script).


pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: rustfmt
      glob: "src-tauri/**/*.rs"
      root: src-tauri/
      run: PATH="$HOME/.cargo/bin:$PATH" cargo fmt --check
    - name: no-secrets
      run: |
        if git diff --cached -U0 | grep -iE '^\+.*(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|syt_[A-Za-z0-9_-]{20,})'; then
          echo "Possible secret in staged changes — aborting commit."
          exit 1
        fi

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: bunx tsc --noEmit
    - name: clippy
      root: src-tauri/
      # The `keeper` shell crate needs GTK/glib development packages to build
      # on Linux. Where they are absent (a headless container, no root to
      # install them) the build dies inside glib-sys before any of our code is
      # compiled, and a hook that always fails is a hook everyone bypasses.
      #
      # So: lint the whole workspace where that is possible, and otherwise lint
      # every crate that CAN build here while saying plainly which one was not
      # covered and how to cover it. `bun run check:rust:macos` runs the real
      # workspace gate on a macOS host, and CI builds the shell on macOS too.
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        if pkg-config --exists glib-2.0 2>/dev/null; then
          cargo clippy --workspace --all-targets -- -D warnings
        else
          echo "note: glib-2.0 is absent, so the tauri shell cannot be built here."
          echo "note: linting keeper-core, keeper-sync and keeper-syncd only."
          echo "note: run 'bun run check:rust:macos' to gate the shell before merging."
          cargo clippy -p keeper-core -p keeper-sync -p keeper-syncd \
            --all-targets -- -D warnings
        fi
    - name: frontend-tests
      run: bun run test
    - name: design
      # The Keeper Room identity lives in roughly 4% of the pixels, so it cannot
      # be defended by review. This recomputes the contrast of every token
      # against every surface of its own theme and bans the patterns the palette
      # was cleaned of. It caught a shipped AA failure the first time it ran.
      run: bun run check:design
