    "bundled",
    "fallible_uint",
]

[dependencies.ryu-js]
version = "1.0.3"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.ssp2]
version = "0.97.0"
package = "syncular-ssp2"

[dependencies.syncular-authority]
version = "0.97.0"
optional = true

[dependencies.tungstenite]
version = "0.30"
features = ["rustls-tls-webpki-roots"]
optional = true

[dependencies.ureq]
version = "3.5"
optional = true

[dependencies.url]
version = "2"
optional = true

[dependencies.uuid]
version = "1"
features = ["v4"]

[dependencies.yrs]
version = "0.28"
optional = true

[dev-dependencies.rusqlite]
version = "0.41"
