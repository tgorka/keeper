[package]
edition = "2021"
name = "syncular-client"
version = "0.97.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Syncular v2 Rust client core on rusqlite, implemented from SPEC.md alone (language-neutrality POC, stage 2)"
readme = false
license = "Apache-2.0"
repository = "https://github.com/syncular/syncular"

[features]
bench-internals = ["dep:libc"]
crdt-yjs = [
    "dep:yrs",
    "syncular-authority?/crdt-yjs",
]
default = []
e2ee = [
    "ssp2/e2ee",
    "dep:rand_core",
]
local-authority = ["dep:syncular-authority"]
native-transport = [
    "dep:ureq",
    "dep:tungstenite",
    "dep:url",
    "dep:polling",
]

[lib]
name = "syncular_client"
path = "src/lib.rs"

[[test]]
name = "generated_queries"
path = "tests/generated_queries.rs"

[[test]]
name = "local_unique"
path = "tests/local_unique.rs"

[[test]]
name = "realtime_disconnect"
path = "tests/realtime_disconnect.rs"

[[test]]
name = "wasm_identity_open"
path = "tests/wasm_identity_open.rs"

[dependencies.libc]
version = "0.2"
optional = true

[dependencies.polling]
version = "3"
optional = true

[dependencies.rand_core]
version = "0.6"
features = ["getrandom"]
optional = true

[dependencies.rusqlite]
version = "0.41"
