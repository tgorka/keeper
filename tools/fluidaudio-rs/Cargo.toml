[package]
name = "fluidaudio-rs"
# Upstream crate version this fork was cut from, plus keeper's fork marker.
version = "0.14.8-keeper.1"
edition = "2021"
description = "keeper's fork of fluidaudio-rs: on-device Parakeet ASR, pyannote community-1 diarization and AVAssetReader decoding through FluidAudio 0.17.4"
license = "MIT"
repository = "https://github.com/FluidInference/fluidaudio-rs"
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
