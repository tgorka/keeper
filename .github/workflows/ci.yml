name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check:syncular
      - run: bun run typecheck
      - run: bun run test
      - name: PostHog provisioning safety (no credentials)
        run: node --test scripts/posthog/*.test.mjs

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The vendored tools/fluidaudio-rs bridge (keeper's macOS dependency) is
      # swift-tools-version 6.2, so pick the newest Xcode 26 on the runner.
      - name: Select Xcode 26
        run: |
          # Newest Xcode 26+ on the runner if present, else the runner default; fail only if Swift < 6.2.
          x="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          swift --version
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('tools/fluidaudio-rs/Package.resolved') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # tauri-build's `externalBin` resource check aborts the keeper build
      # script when `binaries/keeper-rec-aarch64-apple-darwin` is absent, so
      # clippy/nextest need the real sidecar staged first (same script the
      # release workflow uses; includes its own smoke test).
      - run: bash scripts/build-keeper-rec.sh
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo nextest run --no-tests=pass
        working-directory: src-tauri

  recording:
    name: Recording sidecar (unit tests + gapless-concat gate)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Pure-logic unit tests (Rotation.swift, Story 17.1) plus the NFR-22
      # gapless-concat gate (Story 17.4): fixtures are generated on the runner
      # via AVAssetWriter (muxing only, no ScreenCaptureKit), so still no
      # capture hardware and no code-signing are needed.
      - run: bash scripts/test-keeper-rec.sh

  ios:
    name: iOS (compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Compile-only iOS gate (AD-32): no signing, no simulator, no Apple creds.
      # Blocks by failure; recorded as a required PR status check in docs/release.md.
      # keeper-agentd is a Linux server binary (story 90.5): this is the iOS
      # check's one form from here on.
      - run: cargo check --workspace --exclude keeper-agentd --target aarch64-apple-ios
        working-directory: src-tauri

  android:
    name: Android (compile and debug APK)
    # Epic 98, story 98.3 #1 (AD-414): the gate for keeper on Android. Nothing
    # Android builds on keeper's Linux dev host or on the Mac, so this job is
    # where the shell's Android half is compiled at all. The runner image
    # carries the Android SDK and NDK; the APK is signed only with the runner's
    # throwaway debug key (the owner signs a release with
    # `bun run install:android`, docs/android.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A debug build of the whole app for one ABI needs more disk than the
      # image leaves free; these toolchains are never used here.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The C build scripts in the graph (aws-lc-sys, libsqlite3-sys, blake3)
      # need the NDK's clang even for `cargo check`.
      - name: NDK toolchain for cargo
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:?the runner image has no NDK}"
          tc="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "NDK_HOME=$ndk"
            echo "CC_aarch64_linux_android=$tc/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$tc/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$tc/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$tc/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$tc/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      # No desktop plugin, no `keyring` (a mock store off Apple and desktop
      # Linux), no Apple framework and no `ort` in the Android graph.
      - run: bun run check:android-graph
      # keeper-agentd is a Linux server binary (story 90.5) and never ships
      # to a phone or tablet.
      - run: cargo check -p keeper -p keeper-core -p keeper-sync -p keeper-agent --target aarch64-linux-android
        working-directory: src-tauri
      - run: bun run tauri android build --debug --apk --target aarch64 --ci
      # 98.3 #6 past the declared coordinates (R351): Gradle lists what it
      # resolved for the APK, transitive dependencies included, and every group
      # in it must be a row of docs/android.md § What Gradle resolves under a
      # licence src-tauri/deny.toml allows.
      - name: Resolved Android classpath
        working-directory: src-tauri/crates/keeper/gen/android
        run: |
          for configuration in universalDebugRuntimeClasspath universalReleaseRuntimeClasspath; do
            ./gradlew -q :app:dependencies --configuration "$configuration"
          done > "$RUNNER_TEMP/android-classpath.txt"
      - run: cargo test -p keeper-core --test android_gradle_licences -- --ignored --exact the_resolved_android_classpath_is_licensed
        working-directory: src-tauri
        env:
          KEEPER_ANDROID_CLASSPATH: ${{ runner.temp }}/android-classpath.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keeper-android-debug-apk
          path: src-tauri/crates/keeper/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  licenses:
    name: License firewall (cargo-deny, JS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Licensing/supply-chain firewall only (Story 11.1). Advisory/vulnerability
      # gating is intentionally out of scope here: the crate graph carries pre-existing
      # `unmaintained` RUSTSEC advisories for Linux-only gtk-rs GTK3 bindings, which are
      # irrelevant to this macOS-first app and would make the required check perma-red.
      - run: cargo deny check licenses bans sources
        working-directory: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run check:licenses

  build:
    name: Tauri build (macOS)
    runs-on: macos-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          # Newest Xcode 26+ on the runner if present, else the runner default; fail only if Swift < 6.2.
          x="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          swift --version
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('tools/fluidaudio-rs/Package.resolved') }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run tauri:build -- --no-bundle
        env:
          # These are public client values, not PostHog management credentials.
          KEEPER_POSTHOG_HOST: ${{ vars.KEEPER_POSTHOG_HOST }}
          KEEPER_POSTHOG_PROJECT_TOKEN: ${{ vars.KEEPER_POSTHOG_PROJECT_TOKEN }}
          # Synthetic only: exercise accidental management-env embedding without a real key.
          POSTHOG_PERSONAL_API_KEY: KEEPER_PRIVILEGED_KEY_MUST_NOT_SHIP_71
      - name: Check public client artifacts for privileged credentials
        run: bun scripts/check-client-secrets.ts dist src-tauri/target/release/keeper src-tauri/crates/keeper/binaries/keeper-rec-aarch64-apple-darwin
