name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed, notarized macOS release (aarch64)
    runs-on: macos-latest
    steps:
      # fetch-depth: 0 pulls full history + tags so the "Egress diff note" step can
      # diff docs/egress.md against the previous tag (Story 11.2, NFR-11, AD-23).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag names the version, but the app's real version lives in
      # tauri.conf.json and nothing reconciled the two: v0.4.0 published assets
      # named 0.4.0 wrapping an app that reported 0.3.0, so every updater check
      # re-offered an update the machine had already installed. Fail here, in
      # seconds, rather than 16 minutes into a build that can only ship a lie.
      - name: Tag must match the app version
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          conf=$(python3 -c "import json; print(json.load(open('src-tauri/crates/keeper/tauri.conf.json'))['version'])")
          if [ "${REF#v}" != "$conf" ]; then
            echo "::error::tag $REF disagrees with tauri.conf.json version $conf — bump the manifests or fix the tag"
            exit 1
          fi
          echo "tag $REF matches the app version"

      # An unsigned macOS build is not a lesser release, it is a broken one. Gatekeeper
      # rejects it, and because an ad-hoc signature's identity is a cdhash that changes on
      # every build, it cannot read keychain items an earlier build wrote — so each update
      # would silently sign the user out. v0.4.0, v0.4.1 and v0.4.2 all shipped that way
      # behind a green run, an "(unsigned build)" title on a draft nobody opens and a
      # `::notice::` nobody reads, which is why the owner's Mac runs a locally-signed build
      # instead of a release artifact. So signing is required, and missing material is named
      # here, in seconds, for the same reason the tag check above does it here: a build that
      # can only ship a lie should not take 16 minutes to say so. Every notarization secret
      # counts, not just the certificate — tauri-action skips notarization silently when the
      # API-key trio is incomplete, which is the same defect wearing a different hat. The
      # keeper-syncd job below is unaffected: it is ordered after this one with
      # `if: always()`, so a Linux box still gets its daemon.
      - name: Apple signing material must be present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # Named one per line rather than looped over indirect expansion: the runner's
          # bash is 3.2, where `${#arr[@]}` on an empty array trips `set -u`, and a gate
          # this load-bearing has to be correct by reading. Only the NAME is ever echoed.
          missing=""
          [ -n "${APPLE_CERTIFICATE:-}" ] || missing="$missing APPLE_CERTIFICATE"
          [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] || missing="$missing APPLE_CERTIFICATE_PASSWORD"
          [ -n "${APPLE_SIGNING_IDENTITY:-}" ] || missing="$missing APPLE_SIGNING_IDENTITY"
          [ -n "${KEYCHAIN_PASSWORD:-}" ] || missing="$missing KEYCHAIN_PASSWORD"
          [ -n "${APPLE_API_ISSUER:-}" ] || missing="$missing APPLE_API_ISSUER"
          [ -n "${APPLE_API_KEY_ID:-}" ] || missing="$missing APPLE_API_KEY_ID"
          [ -n "${APPLE_API_KEY_P8_BASE64:-}" ] || missing="$missing APPLE_API_KEY_P8_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::this release cannot be signed or notarized — missing secrets:$missing. Add them per docs/release.md and re-run this workflow. Nothing is published unsigned."
            exit 1
          fi
          echo "every Apple signing and notarization secret is present"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # App Store Connect notarization needs the API key on disk. The secret holds
      # the base64-encoded .p8; decode it to a file that tauri-action can read. Note
      # the secret is named APPLE_API_KEY_P8_BASE64 (not APPLE_API_KEY) so it never
      # collides with the APPLE_API_KEY env var below, which is the Key ID string.
      # It is present unconditionally: the gate above already failed the job otherwise.
      - name: Decode the notarization API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/api_key.p8"

      # Build + codesign the keeper-rec capture sidecar BEFORE tauri-action bundles
      # and notarizes the app (the externalBin notarization rough edge, tauri#11992):
      # externalBin is copied into the bundle as-is, so it must already carry a valid
      # hardened-runtime Developer ID signature or notarization staples fail. We import
      # the Developer ID cert into a temp keychain (reusing the existing signing
      # secrets), build the sidecar, then sign it in place. tauri-action reuses the same
      # login keychain for its own signing, so the identity remains available to it.
      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Build & codesign keeper-rec sidecar
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          bun run rec:build
          BIN="src-tauri/crates/keeper/binaries/keeper-rec-aarch64-apple-darwin"
          codesign --force --options runtime \
            --entitlements src-tauri/crates/keeper/keeper-rec.entitlements \
            --sign "$APPLE_SIGNING_IDENTITY" "$BIN"
          codesign -dv --verbose=2 "$BIN"

      - name: Build, sign, notarize, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID signing (base64 .p12 + password + identity + keychain password).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # App Store Connect API-key notarization.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/api_key.p8
          # Signed auto-updates (Story 11.2, NFR-12). Tauri signs the updater artifacts
          # with this minisign private key; the app verifies each download against the
          # committed `plugins.updater.pubkey` before installing. Both come only from
          # GitHub secrets — the private key is never in the repo. If either secret is
          # empty (e.g. before a maintainer provisions their keypair per docs/release.md)
          # the updater artifacts are simply not signed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "keeper ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/crates/keeper/tauri.conf.json --target aarch64-apple-darwin

      # Per-release egress diff note (Story 11.2, NFR-11, AD-23): docs/egress.md is the
      # canonical, diffable egress surface. Diff it against the previous tag into the job
      # summary so any change to where keeper sends traffic is visible per release. On the
      # first tag (no previous tag) publish the file itself as the baseline. Requires the
      # full-history checkout (fetch-depth: 0) above.
      - name: Egress diff note
        if: always()
        # REF comes in as an env var, never interpolated into the script body, so a
        # crafted ref can't inject shell (GitHub-Actions script-injection guard).
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Egress diff (docs/egress.md)"
            echo
            if [ ! -f docs/egress.md ]; then
              echo "> docs/egress.md is missing at \`$REF\` — the egress surface is undocumented for this release."
            elif prev="$(git describe --tags --abbrev=0 "$REF^" 2>/dev/null)" && [ -n "$prev" ]; then
              # Capture the diff so we can distinguish "no change" from a diff failure
              # instead of blindly swallowing both with `|| true`.
              if diff="$(git diff "$prev" "$REF" -- docs/egress.md)"; then
                if [ -z "$diff" ]; then
                  echo "No change to docs/egress.md since \`$prev\`."
                else
                  echo "Changes since \`$prev\`:"
                  echo
                  echo '```diff'
                  echo "$diff"
                  echo '```'
                fi
              else
                echo "> Could not diff docs/egress.md against \`$prev\` (history incomplete) — review the file manually."
              fi
            else
              echo "No previous tag — publishing the current egress surface as the baseline:"
              echo
              echo '```markdown'
              cat docs/egress.md
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # keeper-syncd, the standalone folder-sync daemon (AD-52).
  #
  # A separate job from the macOS app on purpose: the daemon is Linux-first, is
  # deliberately NOT bundled into the app, and must not be gated on Apple
  # signing secrets. Without this the binary was never published at all, so
  # `keeper-syncd update` had nothing to find and installing it meant building
  # from source on every host.
  #
  # `needs: release` + `if: always()` orders it after the app job WITHOUT making
  # it depend on that job succeeding: a failed or skipped app build still
  # publishes the daemon. The ordering is what matters — when both jobs opened
  # the release themselves, the fast one (this) won and the app's assets went
  # into a SECOND, untagged draft, because GitHub does not key a draft by tag.
  # Running after the app job means exactly one creator at any moment.
  #
  # Each artifact ships a .sha256 sidecar. `keeper-syncd update` refuses an
  # asset whose checksum is missing or does not match, so the sidecar is not
  # decoration — it is the only integrity guarantee that path has. (The app's
  # updater verifies a minisign signature instead; the difference is documented
  # in docs/sync.md rather than glossed over.)
  # -------------------------------------------------------------------------
  syncd:
    name: keeper-syncd (${{ matrix.target }})
    needs: release
    if: always()
    runs-on: ${{ matrix.runner }}
    strategy:
      # One target failing must not withhold the others: a Linux box should
      # still get its binary if the macOS runner is having a bad day.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed per target so the two runners never share a cache entry.
          key: syncd-${{ matrix.target }}
          workspaces: src-tauri

      # -p keeper-syncd only. The workspace also holds the Tauri shell, which
      # needs GTK on Linux and the Swift sidecar on macOS; neither is required
      # to build the daemon, and pulling them in would make this job fail for
      # reasons that have nothing to do with it.
      - name: Build
        working-directory: src-tauri
        run: cargo build --release -p keeper-syncd --target ${{ matrix.target }}

      - name: Package with a checksum
        working-directory: src-tauri
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BIN="target/$TARGET/release/keeper-syncd"
          test -x "$BIN" || { echo "::error::$BIN was not produced"; exit 1; }
          OUT="keeper-syncd-$TARGET"
          cp "$BIN" "$OUT"
          # Bare "<hex>  <name>" so `keeper-syncd update` can take the first
          # field, and `shasum -c` still works by hand.
          if command -v sha256sum >/dev/null; then
            sha256sum "$OUT" > "$OUT.sha256"
          else
            shasum -a 256 "$OUT" > "$OUT.sha256"
          fi
          echo "published $(cat "$OUT.sha256")"

      - name: Attach to the release
        working-directory: src-tauri
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # This job runs after the app job (`needs` + `if: always()`), so the
          # release it uploads into normally already exists. It still opens one
          # when absent — the app job can have failed before publishing, and a
          # Linux box should get its daemon regardless — which is safe here only
          # because the ordering guarantees no second creator is running: two
          # concurrent creators produce two drafts, not one shared release.
          if ! gh release view "$REF" >/dev/null 2>&1; then
            gh release create "$REF" --draft --title "keeper $REF" \
              --notes "Release assets are still uploading."
          fi
          # --clobber so re-running a release replaces the asset instead of
          # failing on a name collision.
          gh release upload "$REF" \
            "keeper-syncd-$TARGET" "keeper-syncd-$TARGET.sha256" \
            --clobber
